name: compliance

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - unlabeled

jobs:
  add-compliance-label:
    runs-on: ubuntu-latest
    steps:
      - name: Add Standard-Change label to PR
        uses: actions-ecosystem/action-add-labels@18f1af5e3544586314bbe15c0273249c770b2daf # v1
        with:
          labels: Standard-Change
