name: Update Canton versions

on:
  schedule:
    # Run once a day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:

defaults:
  run:
    shell: bash -euo pipefail -c "source nix.source && exec bash -euo pipefail {0}"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-versions:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        fetch-depth: 0

    - name: Determine current Splice version
      id: splice
      run: |
        set -euo pipefail
  
        SPLICE_VERSION="$(
          curl --fail --silent --show-error \
            https://docs.dev.global.canton.network.sync.global/info |
            jq -r '.synchronizer.current.version'
        )"
  
        if [[ -z "${SPLICE_VERSION}" || "${SPLICE_VERSION}" == "null" ]]; then
          echo "Failed to determine Splice version"
          exit 1
        fi
  
        echo "Splice version: ${SPLICE_VERSION}"
        echo "version=${SPLICE_VERSION}" >> "$GITHUB_OUTPUT"

    - name: Determine Canton version from splice canton image
      id: canton
      env:
        SPLICE_VERSION: ${{ steps.splice.outputs.version }}
      run: |
        set -euo pipefail
  
        IMAGE="ghcr.io/digital-asset/decentralized-canton-sync/docker/canton-participant:${SPLICE_VERSION}"
  
        echo "Using image: ${IMAGE}"
  
        CANTON_VERSION="$(
          docker run --rm \
            --entrypoint=/bin/sh \
            "${IMAGE}" \
            -c 'bin/canton --version' |
          grep '^Canton:' |
          awk '{print $2}'
        )"
  
        if [[ -z "${CANTON_VERSION}" ]]; then
          echo "Failed to determine Canton version"
          exit 1
        fi
  
        echo "Canton version: ${CANTON_VERSION}"
        echo "version=${CANTON_VERSION}" >> "$GITHUB_OUTPUT"

