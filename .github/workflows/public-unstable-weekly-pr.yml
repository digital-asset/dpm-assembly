name: public-unstable-weekly-pr

on:
  schedule:
    - cron: "0 8 * * 4" #every Thursday at 4:00 AM UTC
  workflow_dispatch:

defaults:
  run:
    shell: bash -euo pipefail -c "source nix.source && exec bash -euo pipefail {0}"

permissions:
  contents: read
  id-token: write

jobs:
  create-pr:
    runs-on: digital-asset-dpm-assembly
    env:
      READ_REGISTRY: 'europe-docker.pkg.dev/da-images/public-all'
      READ_GHCR_REGISTRY_DPM: 'ghcr.io/digital-asset/temp'
      REGISTRY: 'europe-docker.pkg.dev/da-images/public-unstable'
      PROJECT: 'da-images'
      BUCKET: 'da-images-public-unstable'
      DOMAIN: 'get.digitalasset.com'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_REBASE_PAT }}
      - uses: ./.github/actions/nix
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 #v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: projects/794775982379/locations/global/workloadIdentityPools/github-actions/providers/da-provider
          service_account: gh-da-dpmass@da-images.iam.gserviceaccount.com
      - name: Login to GAR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 #v4.7.0
        with:
          registry: europe-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: 'download dpm'
        run: |
          echo "::group::Starting dpm installation"
          ./.github/get-dpm.sh "${REGISTRY}" main
          echo "::endgroup::"
      - name: 'open PR'
        run: |
          ./open-unstable-weekly-pr.sh
        env:
          GH_TOKEN: ${{ secrets.AUTO_REBASE_PAT }}
