name: public-unstable-3-5

on:
  push:

  schedule:
    - cron: "0 10 * * 1-5"

defaults:
  run:
    shell: bash -euo pipefail -c "source nix.source && exec bash -euo pipefail {0}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  READ_REGISTRY: 'europe-docker.pkg.dev/da-images/public-unstable'
  READ_GHCR_REGISTRY_DPM: 'ghcr.io/digital-asset/temp/temp'
  REGISTRY: 'europe-docker.pkg.dev/da-images/public-unstable'
  PROJECT: 'da-images'
  BUCKET: 'da-images-public-unstable'
  DOMAIN: 'get.digitalasset.com'

jobs:
  oci-bundle:
    runs-on: digital-asset-dpm-assembly
    outputs: 
      unstable_version: ${{ steps.versions2.outputs.unstable }}
      stable_version: ${{ steps.versions2.outputs.stable }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/nix
      - uses: ./.github/actions/gcloud-login
        with:
          key: ${{ secrets.DA_IMAGES }}
      - name: Versions
        id: versions2
        uses: ./.github/actions/versions
      - uses: ./.github/actions/release-unstable
        with:
          manifest: "latest/unstable/3.5.yaml"
          extra-tags: --extra-tags="${{ github.ref_name }}"
          
  docker:
    runs-on: digital-asset-dpm-assembly
    needs:
      - oci-bundle
    outputs:
      unstable-tag: ${{ steps.versions.outputs.unstable }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Login to GAR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: europe-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.DA_IMAGES }}
      - uses: ./.github/actions/nix

      - name: Versions
        id: versions
        uses: ./.github/actions/versions

      - name: Docker Tags
        id: tags
        uses:  ./.github/actions/docker-tags
        with:
          name: "sdk"

      - name: Docker Build and Publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.versions.outputs.unstable }}
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64,linux/arm64

  docker-test:
    runs-on: digital-asset-dpm-assembly
    needs:
      - docker
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/nix
      - name: Login to GAR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: europe-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.DA_IMAGES }}


      - name: Create temp writable directory
        run: |
          mkdir -p "$RUNNER_TEMP/my-temp-dir"
          echo "Temp dir: $RUNNER_TEMP/my-temp-dir"

      - name: Run Bats tests
        run: VERSION="${{ needs.docker.outputs.unstable-tag }}" bats ./test/dpm-docker.bats --report-formatter junit --output "${RUNNER_TEMP}/my-temp-dir"

      - name: Test Report
        uses: dorny/test-reporter@fe45e9537387dac839af0d33ba56eed8e24189e8 # v2.3.0
        with:
          name: docker tests
          path: ${{ runner.temp }}/my-temp-dir/*.xml
          reporter: java-junit
          fail-on-empty: false

  test-windows-archive-installation:
    runs-on: windows-latest
    timeout-minutes: 30
    needs:
      - oci-bundle
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Create temp dir
        run: |
          RUNNER_TEMP_DIR="${RUNNER_TEMP}/dpm-home"
          mkdir -p "${RUNNER_TEMP_DIR}"
          echo "DPM_HOME=${RUNNER_TEMP_DIR}" >> "${GITHUB_ENV}"
        shell: bash
      - name: Create new non-admin user
        run: |
          net user foo p@ssw0rd /add

          $pass = ConvertTo-SecureString "p@ssw0rd" -AsPlainText -Force
          $cred = [pscredential]::new("foo", $pass)

          ## This command should fail, validating that "foo" has no admin rights
          $p = Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList "/c net session" `
            -Credential $cred `
            -NoNewWindow `
            -Wait `
            -PassThru

          if ($p.ExitCode -eq 0) {
            throw "user appears to have admin rights"
          } else {
            Write-Host "non-admin confirmed"
          }
        shell: powershell
      - name: Download latest dpm windows archive
        run: |
          echo "Determining latest SDK tarball link..."

          ZIP_URL="$(curl -s https://get.digitalasset.com/unstable/install/latest-windows-archive.html | grep -oE 'https://[^ ]+\.zip')"
          ZIP_PATH="${RUNNER_TEMP}/dpm-windows-amd64.zip"

          if [ -z "${ZIP_URL}" ] ; then
            echo "Failed to determine latest SDK download link."
            exit 1
          fi
          echo "Latest SDK version tarball link is ${ZIP_URL}"

          curl -o "${ZIP_PATH}" "${ZIP_URL}"
        shell: bash
      - name: Run bootstrap as non-admin user
        shell: pwsh
        run: |
          $ZIP_PATH = "$env:RUNNER_TEMP/dpm-windows-amd64.zip"
          $EXTRACTED = Join-Path "$env:RUNNER_TEMP" "extracted"
          $exe = Join-Path $EXTRACTED "windows-amd64\bin\dpm.exe"

          Expand-Archive -Path $ZIP_PATH -DestinationPath $EXTRACTED

          $pass = ConvertTo-SecureString "p@ssw0rd" -AsPlainText -Force
          $cred = [pscredential]::new("foo", $pass)
          $argPath = Join-Path $EXTRACTED "windows-amd64"

          $cmd = "set `"DPM_LOG_LEVEL=debug`" && set `"DPM_HOME=$env:DPM_HOME`" && set `"TMP=$env:DPM_HOME`" && `"$exe`" bootstrap `"$argPath`""

          $p = Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList "/c $cmd" `
            -Credential $cred `
            -NoNewWindow `
            -Wait `
            -PassThru `
            
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
      - name: verify installation
        shell: pwsh
        run: |
          $pass = ConvertTo-SecureString "p@ssw0rd" -AsPlainText -Force
          $cred = [pscredential]::new("foo", $pass)

          $exe = Join-Path $env:DPM_HOME "bin\dpm.cmd"

          # This command should fail unless temp dir is overriden to one the user has perms to 
          # (for writing the resolution file)
          $cmd = "set `"DPM_LOG_LEVEL=debug`" && set `"DPM_HOME=$env:DPM_HOME`" && set `"TMP=$env:DPM_HOME`" && `"$exe`" --help"

          $p = Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList "/c $cmd" `
            -Credential $cred `
            -NoNewWindow `
            -Wait `
            -PassThru `

          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }

  test-release:
    uses: ./.github/workflows/test-release.yml
    needs:
      - oci-bundle
    with:
      registry: europe-docker.pkg.dev/da-images/public-unstable
      version-tag: ${{ needs.oci-bundle.outputs.stable_version }}

  update-tags:
    runs-on: digital-asset-dpm-assembly
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/nix
      - uses: ./.github/actions/gcloud-login
        with:
          key: ${{ secrets.DA_IMAGES }}

      # DPM
      - name: update tags for dpm
        uses: ./.github/actions/update-tags
        with:
          artifacts: '["components/dpm"]'
          version: 1.0.21
          tags: '["latest","devnet","testnet","mainnet"]'

      # SDK bundle / docker
      - name: update tags for sdk (devnet)
        uses: ./.github/actions/update-tags
        with:
          artifacts: '["sdk-manifests/open-source", "docker/sdk"]'
          version: 3.5.4
          tags: '["3.5","devnet"]'

      - name: update tags for sdk (testnet)
        uses: ./.github/actions/update-tags
        with:
          artifacts: '["sdk-manifests/open-source", "docker/sdk"]'
          version: 3.5.3
          tags: '["testnet"]'

      - name: update tags for sdk (mainnet)
        uses: ./.github/actions/update-tags
        with:
          artifacts: '["sdk-manifests/open-source", "docker/sdk"]'
          version: 3.5.2
          tags: '["mainnet"]'

      # Canton
      - name: update tags for canton (devnet)
        uses: ./.github/actions/update-tags
        with:
          artifacts: '["components/canton-open-source","docker/canton-base","docker/canton-mediator","docker/canton-sequencer","docker/canton-participant"]'
          version: 3.5.11
          tags: '["3.5","devnet"]'

      - name: update tags for canton (testnet)
        uses: ./.github/actions/update-tags
        with:
          artifacts: '["components/canton-open-source","docker/canton-base","docker/canton-mediator","docker/canton-sequencer","docker/canton-participant"]'
          version: 3.5.10
          tags: '["testnet"]'

      - name: update tags for canton (mainnet)
        uses: ./.github/actions/update-tags
        with:
          artifacts: '["components/canton-open-source","docker/canton-base","docker/canton-mediator","docker/canton-sequencer","docker/canton-participant"]'
          version: 3.5.9
          tags: '["mainnet"]'

      # PQS
      - name: update tags for pqs (all)
        uses: ./.github/actions/update-tags
        with:
          artifacts: '["components/scribe", "docker/participant-query-store", "docker/scribe", "charts/participant-query-store"]'
          version: 3.5.7
          tags: '["3.5","devnet","testnet","mainnet"]'

      # Daml Shell
      - name: update tags for daml-shell (all)
        uses: ./.github/actions/update-tags
        with:
          artifacts: '["components/daml-shell","docker/daml-shell"]'
          version: 3.5.1
          tags: '["3.5","devnet","testnet","mainnet"]'

      # damlc
      - name: update tags for damlc (all)
        uses: ./.github/actions/update-tags
        with:
          artifacts: '["components/damlc"]'
          version: 3.5.2
          tags: '["3.5","devnet","testnet","mainnet"]'

      # Upgrade Check
      - name: update tags for upgrade-check (all)
        uses: ./.github/actions/update-tags
        with:
          artifacts: '["components/upgrade-check"]'
          version: 3.5.2
          tags: '["3.5","devnet","testnet","mainnet"]'

      # Daml Script
      - name: update tags for daml-script (all)
        uses: ./.github/actions/update-tags
        with:
          artifacts: '["components/daml-script"]'
          version: 3.5.2
          tags: '["3.5","devnet","testnet","mainnet"]'

      # Daml New
      - name: update tags for daml-new (all)
        uses: ./.github/actions/update-tags
        with:
          artifacts: '["components/daml-new"]'
          version: 3.5.2
          tags: '["3.5","devnet","testnet","mainnet"]'

      # Codegen
      - name: update tags for codegen (all)
        uses: ./.github/actions/update-tags
        with:
          artifacts: '["components/codegen"]'
          version: 3.5.2
          tags: '["3.5","devnet","testnet","mainnet"]'

      # darsyncer
      - name: update tags for darsyncer (all)
        uses: ./.github/actions/update-tags
        with:
          artifacts: '["docker/darsyncer"]'
          version: 2.9.7
          tags: '["devnet","testnet","mainnet"]'

      # darsyncer
      - name: update tags for covalidation service (all)
        uses: ./.github/actions/update-tags
        with:
          artifacts: '["docker/covalidation-service"]'
          version: 0.7.4
          tags: '["latest","devnet","testnet","mainnet"]'

      # cometbft
      - name: update tags for cometbft (all)
        uses: ./.github/actions/update-tags
        with:
          artifacts: '["docker/cometbft-canton-network"]'
          version: "3.5.0-snapshot.20260203.17930.0.v8a849517-stable-20260204"
          tags: '["devnet","testnet","mainnet"]'