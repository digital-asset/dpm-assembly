name: public-unstable-3-5

on:
  workflow_call:
    inputs:
      registry:
        required: true
        type: string
      version-tag:
        type: string

jobs:
  test-bundle-linux:
    runs-on: digital-asset-dpm-assembly
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/nix
      - name: Uptick versions
        run: |
          version_tag="${{ inputs.version-tag }}"
          if [ "$version_tag" != "" ]; then
            echo "$version_tag" > VERSION
          fi
      - name: Versions
        id: versions
        uses: ./.github/actions/versions
      - name: Test release
        uses: ./.github/actions/test-release
        with:
          version: ${{ steps.versions.outputs.unstable }}
          registry: ${{ inputs.registry }}

  test-bundle-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Install newer bash
        # We need bash 4 for nix to work.
        run: brew install bash
        shell: bash
      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      - uses: ./.github/actions/nix
      - name: Uptick versions
        run: |
          version_tag="${{ inputs.version-tag }}"
          if [ "$version_tag" != "" ]; then
            echo "$version_tag" > VERSION
          fi
      - name: Versions
        id: versions
        uses: ./.github/actions/versions
      - name: Test release
        uses: ./.github/actions/test-release
        with:
          version: ${{ steps.versions.outputs.unstable }}
          registry: ${{ inputs.registry }}

  test-bundle-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ORAS_VERSION: 1.3.0
      BATS_SHA: 713504bc0224a19b3d7c7958c18dc07f64f54b44 # 1.12.0 - matching the nix/bats.nix derivation version
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      # Nix.source is required on macos and linux, avoid conditional logic everywhere by faking one for windows.
      - name: Fake nix.source
        run: |
          touch nix.source
        shell: bash
      - name: Enable long paths
        run: |
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Type DWord -Value 1
      - name: Install Oras
        run: |
          tmpdir="$(mktemp -d)"
          curl -Lo "${tmpdir}/oras.zip" "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_windows_amd64.zip"
          unzip -d "${tmpdir}" "${tmpdir}/oras.zip"
          mkdir -p "${USERPROFILE}/bin"
          cp "${tmpdir}/oras.exe" "${USERPROFILE}/bin"

          cat > "${USERPROFILE}/bin/oras.cmd" << EOF
            @echo off
            "oras.exe" %*
          EOF

          echo "PATH=${tmpdir}/bin:${PATH}" >> "${GITHUB_ENV}"
        shell: bash
      - name: Install postgres
        run: |
          download_dir=$(mktemp -d)
          cd "$download_dir"
          curl https://get.enterprisedb.com/postgresql/postgresql-18.3-1-windows-x64-binaries.zip --output postgres.zip
          unzip postgres.zip -d "${HOME}"
          postgres_bin=${HOME}/pgsql/bin
          export PATH="${postgres_bin}:${PATH}"
          echo "PATH=${postgres_bin}:${PATH}" >> "${GITHUB_ENV}"
        shell: bash
      - name: Install bats
        run: |
          clone_dir=$(mktemp -d)
          git clone https://github.com/bats-core/bats-core.git "$clone_dir"
          cd "$clone_dir"
          git checkout "$BATS_SHA"
          ./install.sh "$HOME"
          cd -
          rm -rf "$clone_dir"
        shell: bash
      - name: Uptick versions
        run: |
          version_tag="${{ inputs.version-tag }}"
          if [ "$version_tag" != "" ]; then
            echo "$version_tag" > VERSION
          fi
        shell: bash
      - name: Versions
        id: versions
        uses: ./.github/actions/versions
      - name: Test release
        uses: ./.github/actions/test-release
        with:
          version: ${{ steps.versions.outputs.unstable }}
          registry: ${{ inputs.registry }}
